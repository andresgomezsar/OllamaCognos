<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OllamaCognos Debug</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.6;
    }
    h1 {
      color: #333;
    }
    pre {
      background-color: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      overflow: auto;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }
    button {
      background: #4CAF50;
      border: none;
      color: white;
      padding: 10px 15px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
    }
    .error {
      color: #ff0000;
    }
  </style>
</head>
<body>
  <h1>OllamaCognos Debug Page</h1>
  
  <div class="card">
    <h2>API Connection Test</h2>
    <button onclick="testAPI()">Test API Connection</button>
    <div id="apiResult"></div>
  </div>
  
  <div class="card">
    <h2>Environment Info</h2>
    <div id="envInfo"></div>
  </div>
  
  <div class="card">
    <h2>Authentication Status</h2>
    <button onclick="checkAuth()">Check Auth Status</button>
    <div id="authStatus"></div>
  </div>

  <script>
    // Display environment info
    function showEnvInfo() {
      const envInfo = document.getElementById('envInfo');
      envInfo.innerHTML = `
        <p><strong>URL:</strong> ${window.location.href}</p>
        <p><strong>User Agent:</strong> ${navigator.userAgent}</p>
      `;
    }
    
    // Test basic API connectivity
    async function testAPI() {
      const apiResult = document.getElementById('apiResult');
      apiResult.innerHTML = 'Testing API connection...';
      
      try {
        const response = await fetch('/api/status');
        const data = await response.json();
        apiResult.innerHTML = `
          <p>Status: ${response.status}</p>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
      } catch (error) {
        apiResult.innerHTML = `<p class="error">Error: ${error.message}</p>`;
      }
    }
    
    // Check authentication status
    async function checkAuth() {
      const authStatus = document.getElementById('authStatus');
      authStatus.innerHTML = 'Checking authentication status...';
      
      try {
        const response = await fetch('/api/auth/status');
        const data = await response.json();
        authStatus.innerHTML = `
          <p>Status: ${response.status}</p>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
      } catch (error) {
        authStatus.innerHTML = `<p class="error">Error: ${error.message}</p>`;
      }
    }
    
    // Run on page load
    showEnvInfo();
  </script>
</body>
</html>
